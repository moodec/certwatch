[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certwatch"
version = "0.1.0"
description = "CLI for monitoring Certificate Transparency logs against domain rules"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "cryptography>=42",
]

[project.scripts]
certwatch = "certwatch.cli:main"

[tool.setuptools]
packages = ["certwatch"]
