# certwatch config — Airbnb bug bounty scope
# In-scope domains pulled from HackerOne structured_scopes (bounty-eligible only).
#
# Logs: run `certwatch logs` to refresh. These two cover ~95% of new certs.
[[logs]]
name = "argon2026h1"
url = "https://ct.googleapis.com/logs/us1/argon2026h1/"

[[logs]]
name = "xenon2026h1"
url = "https://ct.googleapis.com/logs/eu1/xenon2026h1/"

[notify.discord]
webhook_url_env = "CERTWATCH_DISCORD_WEBHOOK"
batch_window_seconds = 5
batch_max = 10

[[rules]]
name = "airbnb-core"
tags = ["airbnb", "bounty"]
patterns = [
  "*.airbnb.com",
  "airbnb.com",
]

[[rules]]
name = "airbnb-adjacent"
tags = ["airbnb", "bounty"]
patterns = [
  "*.muscache.com",
  "muscache.com",
  "*.airbnbcitizen.com",
  "airbnbcitizen.com",
  "*.atairbnb.com",
  "*.withairbnb.com",
  "*.byairbnb.com",
  "*.airbnb-aws.com",
  "*.airbnb.org",
  "airbnb.org",
  "*.airbnbpayments.com",
  "airbnbpayments.com",
  "*.musta.ch",
  "musta.ch",
]

[[rules]]
name = "airbnb-acquisitions"
tags = ["airbnb", "bounty", "acquisition"]
patterns = [
  "*.luxuryretreats.com",
  "luxuryretreats.com",
  "*.hoteltonight.com",
  "www.hoteltonight.com",
  "hoteltonight.com",
  "*.hoteltonight-test.com",
]
